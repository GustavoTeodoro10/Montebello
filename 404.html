<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Página não encontrada — Espaço VIP Montebello</title>

  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&display=swap" />

  <script data-goatcounter="https://teocode.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

  <style>
    :root {
      --accent: #C9A84C;
      --text:   #1C1917;
      --muted:  #6B6560;
      --bg:     #FAFAF8;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .logo { width: 64px; height: 64px; border-radius: 9999px; object-fit: cover; margin-bottom: 1.5rem; }
    .num {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 400;
      line-height: 1;
      color: var(--accent);
      margin: 0 0 .5rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 500;
      margin: 0 0 1rem;
    }
    p { color: var(--muted); margin: 0 0 2rem; max-width: 36ch; line-height: 1.6; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: .875rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .75rem 1.75rem;
      border-radius: 9999px;
      transition: background 150ms;
    }
    .btn:hover { background: #B8972D; }
  </style>
</head>
<body>
  <img src="assets/logo.jpg" alt="Logo Espaço VIP Montebello" class="logo" width="64" height="64" />
  <p class="num" aria-hidden="true">404</p>
  <h1>Página não encontrada</h1>
  <p>O endereço que você acessou não existe ou foi movido. Volte para a página inicial.</p>
  <a href="index.html" class="btn">Voltar ao início</a>
</body>
</html>
